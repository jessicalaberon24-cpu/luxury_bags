<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Failed - Alonzo Luxury Bags 👜</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.30)
                ),
                url("images/background.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            padding: 20px;
        }

        .failure-box {
            width: 100%;
            max-width: 500px;
            text-align: center;

            background: rgba(0, 0, 0, 0.78);
            border: 2px solid #d4af37;
            border-radius: 20px;

            padding: 40px 25px;

            box-shadow: 0 0 30px rgba(212, 175, 55, 0.35);
        }

        .error {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        p {
            color: white;
            font-size: 17px;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;
            padding: 13px 25px;

            border: none;
            border-radius: 10px;

            background: #d4af37;
            color: #000;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="failure-box">

        <div class="error">✕</div>

        <h1>Payment Failed</h1>

        <p>
            Unfortunately, your payment was not completed.
        </p>

        <p>
            Your order has not been marked as paid.
        </p>

        <button onclick="goHome()">
            Back to Shop
        </button>

    </div>

    <script>
        function goHome() {
            window.location.href = "/";
        }
    </script>

</body>
</html>
